# CheckHook configuration — /etc/checkhook/checkhook.yaml
#
# One file drives every service. After editing:
#   sudo systemctl restart checkhookd
#
# SAFETY: enforcement is OFF until you set `enforce: true`. While it is false,
# every detector runs in dry-run: it logs what it WOULD block (see
# `checkhook logs`) and blocks nothing.

enforce: false            # true = actually add attacker IPs to the kernel blocklist
backend: nft              # enforcement backend (nft | xdp) — xdp: packaging/install-xdp.sh
block_timeout: 1h         # how long a block lasts before it expires on its own
block_private: false      # never block RFC1918/LAN addresses unless true
skip: []                  # IPs that must never be blocked, e.g. [192.168.0.1]  (your gateway)

ids:                      # signature detector: Snort 3 alert_json or Suricata eve.json
  enabled: true
  alert_file: /var/log/checkhook/snort/alert_json.txt   # Suricata: /var/log/suricata/eve.json

ml:                       # flow classifier: nfstream + RandomForest
  enabled: true
  iface: eth0
  model: /var/lib/checkhook/model.joblib   # train with: checkhook train ... --out <this>
  threshold: 0.9          # pick it with: checkhook eval ... --target-fpr 0.01
  idle: 15
  active: 120

xdp:                      # XDP enforcement (used when backend: xdp)
  iface: eth0
  mode: generic            # generic works on any NIC (Wi-Fi too); native needs driver support

triage:                   # "Check": read-only LLM review of flagged IPs (local Ollama); never blocks or unblocks
  enabled: true
  alert_file: /var/log/checkhook/snort/alert_json.txt   # same file as ids.alert_file
  last: 500
  model: qwen2.5:7b
  host: http://localhost:11434
  lang: Korean
  out: /var/lib/checkhook/triage/report.txt

daemon:                   # checkhookd timers
  expiry_interval: 60     # seconds between expiry checks
  triage_interval: 3600   # seconds between LLM reports
