<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CheckHook">
  <title>CheckHook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7f9"/>
      <stop offset="1" stop-color="#b4bfca"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#2b2f38" stroke-width="2"/>

  <!-- the hook: a swing that comes around from the side -->
  <path d="M 46 182 A 86 86 0 0 1 112 42" fill="none" stroke="#e23b2e" stroke-width="12"
        stroke-linecap="round"/>
  <path d="M 112 42 l -16 -10 m 16 10 l -12 15" fill="none" stroke="#e23b2e" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- upright glove, leaning into the punch -->
  <g transform="translate(-6 -4) rotate(18 150 140)" stroke="#5f6a76" stroke-width="3.5" stroke-linejoin="round">
    <!-- cuff -->
    <rect x="114" y="160" width="76" height="52" rx="10" fill="url(#glove)"/>
    <line x1="114" y1="172" x2="190" y2="172"/>
    <!-- fist -->
    <rect x="104" y="46" width="96" height="124" rx="46" fill="url(#glove)"/>
    <!-- thumb -->
    <rect x="86" y="96" width="40" height="66" rx="20" fill="url(#glove)"/>
    <!-- finger seam -->
    <path d="M 126 70 C 140 60, 166 58, 182 70" fill="none" stroke="#8a96a3" stroke-width="3"
          stroke-linecap="round"/>
    <!-- check on the cuff -->
    <path d="M 136 190 l 9 9 l 20 -22" fill="none" stroke="#e23b2e" stroke-width="7"
          stroke-linecap="round"/>
  </g>
</svg>
